name: Install MomentumFlow Equity v20

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-equity-v20.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Equity v20
        shell: bash
        env:
          EQUITY_V20_B64: ""
          EQUITY_MONITOR_B64: ""
          EQUITY_PANEL_B64: ""
          STRATEGY_PERF_PANEL_B64: ""
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import os

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(
                      f"Could not find patch anchor: {label}"
                  )
              return text.replace(old, new, 1)

          def write_b64(path, env_name):
              data = base64.b64decode(
                  os.environ[env_name]
              )
              Path(path).write_bytes(data)

          # ----------------------------------------------------------
          # New v20 modules/components.
          # ----------------------------------------------------------
          write_b64(
              "momentumflow/equityStrategyV20.js",
              "EQUITY_V20_B64",
          )
          write_b64(
              "momentumflow/equityFastScalpMonitor.js",
              "EQUITY_MONITOR_B64",
          )
          write_b64(
              "momentumflow/frontend/src/components/EquityV20Panel.jsx",
              "EQUITY_PANEL_B64",
          )
          write_b64(
              "momentumflow/frontend/src/components/StrategyPerformancePanel.jsx",
              "STRATEGY_PERF_PANEL_B64",
          )

          # ----------------------------------------------------------
          # Trading config: Equity Focus + v20 + PAPER-only fast scalp.
          # ----------------------------------------------------------
          path = Path("momentumflow/tradingConfig.js")
          s = path.read_text(encoding="utf-8")

          if "equityFocusMode:" not in s:
              s = replace_once(
                  s,
                  "  fastScalpEnabled: false,\n};",
                  "  fastScalpEnabled: false,\n"
                  "  equityFocusMode: true,\n"
                  "  equityV20Enabled: true,\n"
                  "  equityFastScalpEnabled: false,\n"
                  "};",
                  "trading defaults",
              )

              s = replace_once(
                  s,
                  "  out.fastScalpEnabled = asBoolean(out.fastScalpEnabled);\n",
                  "  out.fastScalpEnabled = asBoolean(out.fastScalpEnabled);\n"
                  "  out.equityFocusMode = asBoolean(out.equityFocusMode);\n"
                  "  out.equityV20Enabled = asBoolean(out.equityV20Enabled);\n"
                  "  out.equityFastScalpEnabled = asBoolean(out.equityFastScalpEnabled);\n",
                  "boolean normalization",
              )

              s = replace_once(
                  s,
                  "  if (merged.fastScalpEnabled && selectedMode === 'live') {\n",
                  "  if (\n"
                  "    (\n"
                  "      merged.fastScalpEnabled ||\n"
                  "      merged.equityFastScalpEnabled\n"
                  "    ) &&\n"
                  "    selectedMode === 'live'\n"
                  "  ) {\n",
                  "PAPER-only scalp save gate",
              )

              s = s.replace(
                  "error: 'Fast Scalp is PAPER-only. Switch to Paper Mode before enabling it.',",
                  "error: 'Fast Scalp modes are PAPER-only. Switch to Paper Mode before enabling them.',",
                  1,
              )

              s = replace_once(
                  s,
                  "    fastScalpEnabled: merged.fastScalpEnabled,\n"
                  "    cryptoCooldownMinutes: merged.fastScalpEnabled ? 1 : 30,\n",
                  "    fastScalpEnabled: merged.fastScalpEnabled,\n"
                  "    equityFocusMode: merged.equityFocusMode,\n"
                  "    equityV20Enabled: merged.equityV20Enabled,\n"
                  "    equityFastScalpEnabled: merged.equityFastScalpEnabled,\n"
                  "    cryptoCooldownMinutes: merged.fastScalpEnabled ? 1 : 30,\n"
                  "    equityCooldownMinutes: merged.equityFastScalpEnabled ? 1 : 8,\n",
                  "strategy config mirror",
              )

          path.write_text(s, encoding="utf-8")

          # ----------------------------------------------------------
          # Trading-mode hard gate for PAPER-only fast scalp strategies.
          # ----------------------------------------------------------
          path = Path("momentumflow/tradingMode.js")
          s = path.read_text(encoding="utf-8")

          if "equityFastScalpEnabled" not in s:
              s = replace_once(
                  s,
                  "    if (tradingConfig.fastScalpEnabled === true) {\n",
                  "    if (\n"
                  "      tradingConfig.fastScalpEnabled === true ||\n"
                  "      tradingConfig.equityFastScalpEnabled === true\n"
                  "    ) {\n",
                  "live mode scalp gate",
              )

              s = s.replace(
                  "error: 'Fast Scalp is PAPER-only. Turn Fast Scalp OFF before switching to LIVE.',",
                  "error: 'Fast Scalp modes are PAPER-only. Turn both Fast Scalp switches OFF before switching to LIVE.',",
                  1,
              )

          path.write_text(s, encoding="utf-8")

          # ----------------------------------------------------------
          # Server: start equity fast-scalp reversal monitor.
          # ----------------------------------------------------------
          path = Path("momentumflow/server.js")
          s = path.read_text(encoding="utf-8")

          if "startEquityFastScalpMonitor" not in s:
              s = replace_once(
                  s,
                  "import { startFastScalpMonitor } from './fastScalpMonitor.js';\n",
                  "import { startFastScalpMonitor } from './fastScalpMonitor.js';\n"
                  "import { startEquityFastScalpMonitor } from './equityFastScalpMonitor.js';\n",
                  "server monitor import",
              )

              s = replace_once(
                  s,
                  "startFastScalpMonitor();\n",
                  "startFastScalpMonitor();\n"
                  "startEquityFastScalpMonitor();\n",
                  "server monitor startup",
              )

          path.write_text(s, encoding="utf-8")

          # ----------------------------------------------------------
          # Unified bot v20 wiring.
          # ----------------------------------------------------------
          path = Path("momentumflow/liveBot.js")
          s = path.read_text(encoding="utf-8")

          if "equityStrategyV20.js" not in s:
              s = replace_once(
                  s,
                  "} from './strategyEngine.js';\n",
                  "} from './strategyEngine.js';\n\n"
                  "import {\n"
                  "  EQUITY_V20_DEFAULTS,\n"
                  "  equityPrefilterQuality,\n"
                  "  evaluateEquityCandidateV20,\n"
                  "} from './equityStrategyV20.js';\n",
                  "v20 import",
              )

          s = s.replace(
              "// UNIFIED BOT v19 EXPECTANCY",
              "// UNIFIED BOT v20 ADAPTIVE EQUITIES",
              1,
          )

          s = s.replace(
              "  equityBatchSize: 120,",
              "  equityBatchSize: 150,",
              1,
          )

          s = s.replace(
              "  minDailyDollarVolume: 1000000,",
              "  minDailyDollarVolume: 5000000,",
              1,
          )

          old_strategy_cfg = (
              "const strategyCfg = () => ({\n"
              "  ...STRATEGY_DEFAULTS,\n"
              "  ...store.getConfig('strategyConfig', {}),\n"
              "});\n"
          )

          new_strategy_cfg = (
              "const strategyCfg = () => ({\n"
              "  ...STRATEGY_DEFAULTS,\n"
              "  ...EQUITY_V20_DEFAULTS,\n"
              "  ...store.getConfig('strategyConfig', {}),\n"
              "\n"
              "  equityFocusMode:\n"
              "    tradingCfg().equityFocusMode !== false,\n"
              "\n"
              "  equityV20Enabled:\n"
              "    tradingCfg().equityV20Enabled !== false,\n"
              "\n"
              "  equityFastScalpEnabled:\n"
              "    tradingCfg().equityFastScalpEnabled === true,\n"
              "});\n"
          )

          if (
              "EQUITY_V20_DEFAULTS" in s and
              "const strategyCfg = () => ({\n  ...STRATEGY_DEFAULTS,\n  ...EQUITY_V20_DEFAULTS" not in s
          ):
              s = replace_once(
                  s,
                  old_strategy_cfg,
                  new_strategy_cfg,
                  "strategyCfg",
              )

          if "function strategyPerformanceSummary()" not in s:
              marker = "function pub() {\n"
              pos = s.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "Could not find pub() for strategy performance patch"
                  )

              helper = "\nfunction strategyPerformanceSummary() {\n  const mode =\n    state.mode ||\n    selectedMode();\n\n  const closed =\n    store\n      .getAll('trades')\n      .filter(\n        (trade) =>\n          trade.result !== null &&\n          (\n            trade.execution_mode ||\n            'paper'\n          ) === mode\n      )\n      .slice(-300);\n\n  const groups =\n    new Map();\n\n  for (const trade of closed) {\n    const strategy =\n      String(\n        trade.strategy_name ||\n        trade.entry_signal\n          ?.strategy ||\n        'LEGACY'\n      );\n\n    if (!groups.has(strategy)) {\n      groups.set(\n        strategy,\n        {\n          strategy,\n          trades: 0,\n          wins: 0,\n          losses: 0,\n          pnl: 0,\n          grossWin: 0,\n          grossLoss: 0,\n          lastClosedAt: null,\n        }\n      );\n    }\n\n    const row =\n      groups.get(strategy);\n\n    const pnl =\n      Number(\n        trade.pnl ||\n        0\n      );\n\n    row.trades += 1;\n    row.pnl += pnl;\n\n    if (pnl > 0) {\n      row.wins += 1;\n      row.grossWin += pnl;\n    } else if (pnl < 0) {\n      row.losses += 1;\n      row.grossLoss +=\n        Math.abs(pnl);\n    }\n\n    const closedAt =\n      trade.closed_at ||\n      trade.timestamp ||\n      null;\n\n    if (\n      closedAt &&\n      (\n        !row.lastClosedAt ||\n        new Date(closedAt) >\n          new Date(\n            row.lastClosedAt\n          )\n      )\n    ) {\n      row.lastClosedAt =\n        closedAt;\n    }\n  }\n\n  return [\n    ...groups.values(),\n  ]\n    .map((row) => {\n      const averageWin =\n        row.wins > 0\n          ? row.grossWin /\n            row.wins\n          : 0;\n\n      const averageLoss =\n        row.losses > 0\n          ? row.grossLoss /\n            row.losses\n          : 0;\n\n      const expectancy =\n        row.trades > 0\n          ? row.pnl /\n            row.trades\n          : 0;\n\n      return {\n        strategy:\n          row.strategy,\n        trades:\n          row.trades,\n        wins:\n          row.wins,\n        losses:\n          row.losses,\n        winRate:\n          row.trades > 0\n            ? Number(\n                (\n                  row.wins /\n                  row.trades *\n                  100\n                ).toFixed(2)\n              )\n            : 0,\n        pnl:\n          Number(\n            row.pnl.toFixed(4)\n          ),\n        averageWin:\n          Number(\n            averageWin.toFixed(4)\n          ),\n        averageLoss:\n          Number(\n            averageLoss.toFixed(4)\n          ),\n        expectancy:\n          Number(\n            expectancy.toFixed(4)\n          ),\n        profitFactor:\n          row.grossLoss > 0\n            ? Number(\n                (\n                  row.grossWin /\n                  row.grossLoss\n                ).toFixed(3)\n              )\n            : row.grossWin > 0\n              ? 'Infinity'\n              : 0,\n        sampleEnough:\n          row.trades >= 30,\n        lastClosedAt:\n          row.lastClosedAt,\n      };\n    })\n    .sort(\n      (a, b) =>\n        Number(b.pnl) -\n        Number(a.pnl)\n    );\n}\n\n"
              s = (
                  s[:pos] +
                  helper +
                  s[pos:]
              )

          if "strategyPerformance:" not in s:
              s = replace_once(
                  s,
                  "    scanDiagnostics:\n"
                  "      state.scanDiagnostics,\n\n"
                  "    marketOpen:\n",
                  "    scanDiagnostics:\n"
                  "      state.scanDiagnostics,\n\n"
                  "    strategyPerformance:\n"
                  "      strategyPerformanceSummary(),\n\n"
                  "    marketOpen:\n",
                  "pub strategy performance",
              )

          s = s.replace(
              "'v19-expectancy'",
              "'v20-adaptive-equities'",
          )

          s = s.replace(
              "waiting for v19 setup",
              "waiting for v20 setup",
          )

    if "crypto disabled by equity focus mode" not in s:
        old = "  if(\n    cryptoSymbols.length\n  ) {\n"

              new = """  const equityFocusMode =
            tradingCfg()
              .equityFocusMode !== false;

          if (equityFocusMode) {
            bump(
              diag
                .prefilter
                .crypto,

              'crypto disabled by equity focus mode'
            );
          }

          if (
            !equityFocusMode &&
            cryptoSymbols.length
          ) {
          """

              s = replace_once(
                  s,
                  old,
                  new,
                  "crypto equity-focus gate",
              )

          # Improve the equity prefilter ranking without increasing requests.
          eq_marker = s.find(
              ".equityPrefilterPassed"
          )

          if eq_marker < 0:
              raise SystemExit(
                  "Could not locate equity prefilter"
              )

          if "prefilterQuality:" not in s:
              push_start = s.find(
                  "      pre.push({",
                  eq_marker
              )
              push_end = s.find(
                  "      });",
                  push_start
              )

              if (
                  push_start < 0 or
                  push_end < 0
              ):
                  raise SystemExit(
                      "Could not locate equity pre.push block"
                  )

              push_end += len(
                  "      });"
              )

              new_push = """      const preQuality =
                equityPrefilterQuality({
                  snapshot,
                  momentum,
                  dollarVolume,
                  spread,
                  config: sc,
                });

              pre.push({
                asset,
                snapshot,
                momentum,
                prefilterQuality:
                  preQuality.quality,
                dayMovePct:
                  preQuality.dayMovePct,
              });"""

              s = (
                  s[:push_start] +
                  new_push +
                  s[push_end:]
              )

              sort_start = s.find(
                  "    pre.sort(",
                  push_start
              )
              shortlist_start = s.find(
                  "    const shortlist =",
                  sort_start
              )

              if (
                  sort_start < 0 or
                  shortlist_start < 0
              ):
                  raise SystemExit(
                      "Could not locate equity pre.sort block"
                  )

              new_sort = """    pre.sort(
                (
                  a,
                  b
                ) =>
                  Number(
                    b.prefilterQuality ||
                    0
                  ) -
                  Number(
                    a.prefilterQuality ||
                    0
                  ) ||
                  Math.abs(
                    b.momentum
                  ) -
                  Math.abs(
                    a.momentum
                  )
              );

          """

              s = (
                  s[:sort_start] +
                  new_sort +
                  s[shortlist_start:]
              )

          # Route equity candidates through v20 while preserving legacy fallback.
          if "evaluateEquityCandidateV20({" not in s:
              eval_start = s.find(
                  "        const result =\n"
                  "          evaluateEquityCandidate({",
                  eq_marker
              )

              signal_marker = s.find(
                  "\n\n        const signal =",
                  eval_start
              )

              if (
                  eval_start < 0 or
                  signal_marker < 0
              ):
                  raise SystemExit(
                      "Could not locate equity evaluator call"
                  )

              new_eval = """        const result =
                  sc.equityV20Enabled !== false
                    ? evaluateEquityCandidateV20({
                        asset:
                          item.asset,

                        snapshot:
                          item.snapshot,

                        bars:
                          barsBySymbol[
                            item.asset
                              .symbol
                          ] ||
                          [],

                        marketRegime,

                        config:
                          sc,

                        now,
                        mode,
                      })
                    : evaluateEquityCandidate({
                        asset:
                          item.asset,

                        snapshot:
                          item.snapshot,

                        bars:
                          barsBySymbol[
                            item.asset
                              .symbol
                          ] ||
                          [],

                        marketRegime,

                        config:
                          sc,

                        now,
                      });"""

              s = (
                  s[:eval_start] +
                  new_eval +
                  s[signal_marker:]
              )

          # Give final ranking the prefilter-quality score.
          rank_marker = s.find(
              "        signal.rank =",
              eq_marker
          )

          if rank_marker < 0:
              raise SystemExit(
                  "Could not locate equity signal rank"
              )

          rank_end = s.find(
              "        finalCandidates.push(",
              rank_marker
          )

          rank_slice = s[rank_marker:rank_end]

          if (
              "item.prefilterQuality" not in
              rank_slice
          ):
              updated_rank_slice = rank_slice.replace(
                  "            item.momentum\n"
                  "          );",
                  "            item.momentum,\n"
                  "            item.prefilterQuality\n"
                  "          );",
                  1,
              )

              if updated_rank_slice == rank_slice:
                  raise SystemExit(
                      "Could not patch equity rankSignal call"
                  )

              s = (
                  s[:rank_marker] +
                  updated_rank_slice +
                  s[rank_end:]
              )

          # Upgrade rankSignal itself.
          rank_fn_start = s.find(
              "function rankSignal("
          )
          bump_start = s.find(
              "function bump(",
              rank_fn_start
          )

          if (
              rank_fn_start < 0 or
              bump_start < 0
          ):
              raise SystemExit(
                  "Could not locate rankSignal function"
              )

          new_rank_fn = "\nfunction rankSignal(\n  signal,\n  preMomentum = 0,\n  prefilterQuality = 0\n) {\n  const trend =\n    Math.abs(\n      Number(\n        signal\n          ?.signal\n          ?.trend15Pct ||\n        0\n      )\n    );\n\n  const volume =\n    Number(\n      signal\n        ?.signal\n        ?.recentVolumeRatio ||\n      0\n    );\n\n  const spread =\n    Number(\n      signal\n        ?.signal\n        ?.spreadPct\n    );\n\n  const strategy =\n    String(\n      signal\n        ?.strategy ||\n      ''\n    );\n\n  const setupBonus =\n    strategy.includes(\n      'VWAP_PULLBACK'\n    )\n      ? 0.65\n      : strategy.includes(\n          'ORB'\n        )\n        ? 0.55\n        : strategy.includes(\n            'TREND_CONTINUATION'\n          )\n          ? 0.45\n          : strategy.includes(\n              'FAST_SCALP'\n            )\n            ? 0.15\n            : 0;\n\n  const spreadBonus =\n    Number.isFinite(\n      spread\n    )\n      ? Math.max(\n          0,\n          1 -\n            spread /\n              0.08\n        )\n      : 0;\n\n  return (\n    Number(\n      signal?.score ||\n      0\n    ) +\n\n    Math.min(\n      1.5,\n      trend * 3\n    ) +\n\n    Math.min(\n      1.25,\n      Math.max(\n        0,\n        volume - 0.75\n      )\n    ) +\n\n    Math.min(\n      0.75,\n      Math.abs(\n        Number(\n          preMomentum ||\n          0\n        )\n      ) * 3\n    ) +\n\n    Math.min(\n      1.25,\n      Math.max(\n        0,\n        Number(\n          prefilterQuality ||\n          0\n        ) *\n          0.15\n      )\n    ) +\n\n    spreadBonus +\n    setupBonus\n  );\n}\n\n"

          s = (
              s[:rank_fn_start] +
              new_rank_fn +
              s[bump_start:]
          )

          path.write_text(
              s,
              encoding="utf-8",
          )

          # ----------------------------------------------------------
          # Settings UI.
          # ----------------------------------------------------------
          path = Path(
              "momentumflow/frontend/src/pages/Settings.jsx"
          )
          s = path.read_text(
              encoding="utf-8"
          )

          if "EquityV20Panel" not in s:
              s = replace_once(
                  s,
                  "import FastScalpToggle from '../components/FastScalpToggle.jsx';\n",
                  "import FastScalpToggle from '../components/FastScalpToggle.jsx';\n"
                  "import EquityV20Panel from '../components/EquityV20Panel.jsx';\n"
                  "import StrategyPerformancePanel from '../components/StrategyPerformancePanel.jsx';\n",
                  "Settings v20 imports",
              )

          if "<EquityV20Panel />" not in s:
              title_pos = s.find(
                  "Strategy Analysis"
              )
              section_pos = s.rfind(
                  "<section>",
                  0,
                  title_pos
              )

              if (
                  title_pos < 0 or
                  section_pos < 0
              ):
                  raise SystemExit(
                      "Could not locate Strategy Analysis section"
                  )

              section = """<section>
                <h2 style={h2}>Equity v20 Adaptive</h2>
                <EquityV20Panel />
              </section>

              """

              s = (
                  s[:section_pos] +
                  section +
                  s[section_pos:]
              )

          if "<StrategyPerformancePanel />" not in s:
              s = replace_once(
                  s,
                  "        <RejectionLogPanel />\n",
                  "        <StrategyPerformancePanel />\n"
                  "        <div style={{ height: 10 }} />\n"
                  "        <RejectionLogPanel />\n",
                  "Strategy Analysis performance panel",
              )

          s = s.replace(
              "MOMENTUMFLOW SETTINGS v11",
              "MOMENTUMFLOW SETTINGS v20",
              1,
          )

          path.write_text(
              s,
              encoding="utf-8",
          )

          print(
              "MomentumFlow Equity v20 patch applied."
          )
          PY

      - name: Install backend dependencies
        working-directory: momentumflow
        run: npm install

      - name: Validate backend
        run: |
          node --check momentumflow/equityStrategyV20.js
          node --check momentumflow/equityFastScalpMonitor.js
          node --check momentumflow/tradingConfig.js
          node --check momentumflow/tradingMode.js
          node --check momentumflow/liveBot.js
          node --check momentumflow/server.js
          cd momentumflow
          node --input-type=module -e "await import('./equityStrategyV20.js'); await import('./liveBot.js'); console.log('backend imports ok')"

      - name: Smoke-test v20 evaluator
        working-directory: momentumflow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            evaluateEquityCandidateV20,
            equityPrefilterQuality,
          } from './equityStrategyV20.js';

          const now =
            new Date(
              '2026-08-14T14:15:30Z'
            );

          const bars = [];
          let price = 100;

          for (let i = 0; i < 45; i += 1) {
            const stamp =
              new Date(
                Date.parse(
                  '2026-08-14T13:30:00Z'
                ) +
                i * 60000
              );

            const open = price;
            const close =
              price *
              (
                1 +
                (
                  i < 5
                    ? 0.0002
                    : 0.0005
                )
              );

            bars.push({
              t: stamp.toISOString(),
              o: open,
              h: Math.max(open, close) * 1.0005,
              l: Math.min(open, close) * 0.9995,
              c: close,
              v: 100000 + i * 2000,
            });

            price = close;
          }

          const snapshot = {
            latestTrade: {
              p: price * 1.001,
            },
            latestQuote: {
              bp: price * 1.0006,
              ap: price * 1.0010,
            },
            minuteBar: {
              t: '2026-08-14T14:15:00Z',
              o: price,
              h: price * 1.0015,
              l: price * 0.9998,
              c: price * 1.001,
              v: 180000,
            },
            dailyBar: {
              o: 99,
              c: price,
              v: 3000000,
            },
          };

          const asset = {
            symbol: 'TEST',
            name: 'Test Equity',
            fractionable: true,
            shortable: true,
            easy_to_borrow: true,
          };

          const result =
            evaluateEquityCandidateV20({
              asset,
              snapshot,
              bars,
              marketRegime: {
                direction: 'LONG',
              },
              now,
              mode: 'paper',
            });

          if (!result?.diagnostics) {
            throw new Error(
              'v20 evaluator returned no diagnostics'
            );
          }

          const quality =
            equityPrefilterQuality({
              snapshot,
              momentum: 0.1,
              dollarVolume: 300000000,
              spread: 0.04,
            });

          if (
            !Number.isFinite(
              quality.quality
            )
          ) {
            throw new Error(
              'v20 prefilter quality is invalid'
            );
          }

          console.log(
            'v20 smoke test ok',
            result.signal?.strategy ||
              result.diagnostics.long?.reason
          );
          NODE

      - name: Validate frontend build
        working-directory: momentumflow/frontend
        run: |
          npm install
          npm run build

      - name: Remove generated install/build changes
        shell: bash
        run: |
          git restore momentumflow/package-lock.json 2>/dev/null || true
          git restore momentumflow/frontend/package-lock.json 2>/dev/null || true
          git restore momentumflow/frontend/dist 2>/dev/null || true
          git clean -fd momentumflow/frontend/dist 2>/dev/null || true
          git clean -fd momentumflow/node_modules 2>/dev/null || true
          git clean -fd momentumflow/frontend/node_modules 2>/dev/null || true

      - name: Commit Equity v20
        shell: bash
        run: |
          git config user.name "MomentumFlow Installer"
          git config user.email "actions@users.noreply.github.com"

