name: Paper Strategy Read-Only Health Audit
on:
  push:
    branches:
      - research/shadow-health-20261014
    paths:
      - 'research/shadowStatusProbe.mjs'
      - '.github/workflows/shadow-status-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check research/shadowStatusProbe.mjs
      - run: node research/shadowStatusProbe.mjs
