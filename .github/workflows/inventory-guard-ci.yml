name: Inventory guard safety tests
on:
  push:
    branches:
      - fix/paper-exit-inventory-guard-20261014
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
        working-directory: momentumflow
      - run: node --test brokerExitInventoryGuard.test.mjs liveBotV51Lifecycle.test.js
        working-directory: momentumflow
      - run: node --check liveBotV35.js
        working-directory: momentumflow
