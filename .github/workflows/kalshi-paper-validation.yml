name: Kalshi Paper Integration Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'momentumflow/**'
      - '.github/workflows/kalshi-paper-validation.yml'
  push:
    branches: [kalshi-paper-integration]
    paths:
      - 'momentumflow/**'
      - '.github/workflows/kalshi-paper-validation.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momentumflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momentumflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
