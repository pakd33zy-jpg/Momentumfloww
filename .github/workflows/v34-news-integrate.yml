name: Integrate V34 live news

on:
  push:
    branches:
      - v34-risk-model
    paths:
      - ".github/workflows/v34-news-integrate.yml"
      - "momentumflow/integrate_v34_news.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34 branch
        uses: actions/checkout@v4
        with:
          ref: v34-risk-model
          fetch-depth: 0

      - name: Apply live-news integration
        run: python momentumflow/integrate_v34_news.py

      - name: Install dependencies
        working-directory: momentumflow
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax checks
        working-directory: momentumflow
        run: |
          node --check liveBot.js
          node --check alpacaClient.js
          node --check cryptoStrategyV34.js
          node --check marketIntelligenceV34.js

      - name: Run focused V34 tests
        working-directory: momentumflow
        run: node --test cryptoStrategyV34.test.js marketIntelligenceV34.test.js

      - name: Run full backend tests
        working-directory: momentumflow
        run: npm test

      - name: Commit live-news integration only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add momentumflow/alpacaClient.js momentumflow/liveBot.js momentumflow/cryptoStrategyV34.js
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Wire live catalyst news into V34"
            git push origin HEAD:v34-risk-model
          fi
