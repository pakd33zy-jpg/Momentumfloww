name: V35 crypto 15m data repair

on:
  push:
    paths:
      - '.github/workflows/v35-crypto-15m-data-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Patch V35 crypto history fetch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('momentumflow/liveBotV35.js')
          s = p.read_text()
          old = """      getCryptoBars(mode, detailSymbols, {
        timeframe: '15Min',
        start: new Date(Date.now() - 14 * 24 * 60 * 60000),
        end: now,
        limit: 10000,
      }),"""
          new = """      Promise.all(detailSymbols.map(async (symbol) =>
        getCryptoBars(mode, [symbol], {
          timeframe: '15Min',
          start: new Date(Date.now() - 14 * 24 * 60 * 60000),
          end: now,
          limit: 2000,
          maxPages: 2,
        })
      )).then((parts) => Object.assign({}, ...parts)),"""
          if old not in s:
              raise SystemExit('expected batched 15m fetch block not found')
          s = s.replace(old, new, 1)

          old_counts = """      cryptoQualified: crypto.candidates.length,
      equityQualified: equity.candidates.length,"""
          new_counts = """      cryptoQualified: crypto.candidates.length,
      equityQualified: equity.candidates.length,
      crypto15mCovered: Object.values(state.cryptoBarsCache.bars15m || {}).filter((rows) => Array.isArray(rows) && rows.length >= 24).length,
      crypto15mMissing: Math.max(0, state.universe.crypto.length - Object.values(state.cryptoBarsCache.bars15m || {}).filter((rows) => Array.isArray(rows) && rows.length >= 24).length),"""
          if old_counts not in s:
              raise SystemExit('expected scan diagnostics count block not found')
          s = s.replace(old_counts, new_counts, 1)
          p.write_text(s)
          PY
      - name: Validate syntax
        run: |
          cd momentumflow
          node --check liveBotV35.js
          node --check cryptoStrategyV35.js
          node --check equityStrategyV35.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- momentumflow/liveBotV35.js; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add momentumflow/liveBotV35.js
          git commit -m 'V35 crypto: fetch 15m history per symbol'
          git push origin HEAD:main
