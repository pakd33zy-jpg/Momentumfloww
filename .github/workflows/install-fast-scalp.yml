name: Install Equity Fast Scalp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-equity-fast-scalp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Equity Fast Scalp
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Could not find patch anchor: {label}")
              return text.replace(old, new, 1)

          p = Path("momentumflow/tradingConfig.js")
          s = p.read_text(encoding="utf-8")

          if "fastEquityScalpEnabled" not in s:
              s = replace_once(
                  s,
                  "  fastScalpEnabled: false,\n",
                  "  fastScalpEnabled: false,\n  fastEquityScalpEnabled: false,\n",
                  "trading defaults",
              )

              s = replace_once(
                  s,
                  "  out.fastScalpEnabled = asBoolean(out.fastScalpEnabled);\n",
                  "  out.fastScalpEnabled = asBoolean(out.fastScalpEnabled);\n"
                  "  out.fastEquityScalpEnabled = asBoolean(out.fastEquityScalpEnabled);\n",
                  "boolean normalize",
              )

              s = replace_once(
                  s,
                  "  if (merged.fastScalpEnabled && selectedMode === 'live') {\n",
                  "  if (\n"
                  "    (merged.fastScalpEnabled || merged.fastEquityScalpEnabled) &&\n"
                  "    selectedMode === 'live'\n"
                  "  ) {\n",
                  "PAPER-only save gate",
              )

              s = s.replace(
                  "error: 'Fast Scalp is PAPER-only. Switch to Paper Mode before enabling it.',",
                  "error: 'Fast Scalp modes are PAPER-only. Switch to Paper Mode before enabling them.',",
                  1,
              )

              s = replace_once(
                  s,
                  "    fastScalpEnabled: merged.fastScalpEnabled,\n"
                  "    cryptoCooldownMinutes: merged.fastScalpEnabled ? 1 : 30,\n",
                  "    fastScalpEnabled: merged.fastScalpEnabled,\n"
                  "    fastEquityScalpEnabled: merged.fastEquityScalpEnabled,\n"
                  "    cryptoCooldownMinutes: merged.fastScalpEnabled ? 1 : 30,\n"
                  "    equityCooldownMinutes: merged.fastEquityScalpEnabled ? 1 : 15,\n",
                  "strategy mirror",
              )

          p.write_text(s, encoding="utf-8")

          p = Path("momentumflow/tradingMode.js")
          s = p.read_text(encoding="utf-8")

          if "fastEquityScalpEnabled" not in s:
              s = replace_once(
                  s,
                  "    if (tradingConfig.fastScalpEnabled === true) {\n",
                  "    if (\n"
                  "      tradingConfig.fastScalpEnabled === true ||\n"
                  "      tradingConfig.fastEquityScalpEnabled === true\n"
                  "    ) {\n",
                  "live mode Fast Scalp gate",
              )

              s = s.replace(
                  "error: 'Fast Scalp is PAPER-only. Turn Fast Scalp OFF before switching to LIVE.',",
                  "error: 'Fast Scalp modes are PAPER-only. Turn both Fast Scalp switches OFF before switching to LIVE.',",
                  1,
              )

          p.write_text(s, encoding="utf-8")

          p = Path("momentumflow/strategyEngine.js")
          s = p.read_text(encoding="utf-8")

          if "fastEquityScalpEntryMomentumPct" not in s:
              anchor = "  fastScalpCostLockPct: 0.60,\n"
              addition = """  fastScalpCostLockPct: 0.60,

            // PAPER-only 1-minute EQUITY Fast Scalp.
            // Trades both LONG and SHORT when Alpaca marks the stock
            // shortable/easy-to-borrow for SHORT entries.
            fastEquityScalpEnabled: false,
            fastEquityScalpScoreThreshold: 8,
            fastEquityScalpEntryMomentumPct: 0.18,
            fastEquityScalpMaxSpreadPct: 0.08,
            fastEquityScalpEstimatedRoundTripCostPct: 0.05,
            fastEquityScalpProfitBufferPct: 0.10,
            fastEquityScalpStopLossPct: 0.28,
            fastEquityScalpTakeProfitPct: 0.60,
            fastEquityScalpTrailTriggerPct: 0.36,
            fastEquityScalpTrailDistancePct: 0.12,
            fastEquityScalpTrailFloorPct: 0.22,
            fastEquityScalpMaxHoldMinutes: 5,
            fastEquityScalpReversalMomentumPct: 0.05,
            fastEquityScalpFadeMomentumPct: 0.01,
            fastEquityScalpCostLockPct: 0.25,
          """
              s = replace_once(
                  s,
                  anchor,
                  textwrap.dedent(addition),
                  "equity scalp defaults",
              )

          evaluator = r"""
          function evaluateEquityFastScalpCandidate({
            asset,
            snapshot,
            bars,
            marketRegime,
            config,
            now,
          }) {
            const threshold = Number(
              config.fastEquityScalpScoreThreshold ?? 8
            );

            const both = (detail) => ({
              signal: null,
              diagnostics: {
                long: detail,
                short: detail,
                threshold,
              },
            });

            if (!asset || !snapshot) {
              return both(
                reject('FAST EQUITY SCALP: missing asset or snapshot')
              );
            }

            const all = mergeCurrentMinuteBar(
              bars || [],
              snapshot
            );

            const signalBars = completedBars(
              all,
              now
            );

            if (signalBars.length < 6) {
              return both(
                reject(
                  'FAST EQUITY SCALP: not enough completed 1-minute bars'
                )
              );
            }

            const price = currentPrice(
              snapshot,
              all
            );

            if (!Number.isFinite(price) || price <= 0) {
              return both(
                reject('FAST EQUITY SCALP: invalid current price')
              );
            }

            const momentum = minuteMomentumPct(snapshot);
            const spread = spreadPct(snapshot);

            if (momentum == null) {
              return both(
                reject('FAST EQUITY SCALP: minute momentum unavailable')
              );
            }

            if (spread == null) {
              return both(
                reject('FAST EQUITY SCALP: spread unavailable')
              );
            }

            const maxSpread = Math.max(
              0.01,
              Number(config.fastEquityScalpMaxSpreadPct ?? 0.08)
            );

            if (spread > maxSpread) {
              return both(
                reject(
                  `FAST EQUITY SCALP: spread ${spread.toFixed(3)}% > ${maxSpread}%`,
                  {
                    spreadPct: Number(spread.toFixed(4)),
                    minuteMomentumPct: Number(momentum.toFixed(4)),
                  }
                )
              );
            }

            const direction =
              momentum >= 0
                ? 'LONG'
                : 'SHORT';

            if (
              direction === 'SHORT' &&
              !(
                asset.shortable === true &&
                asset.easy_to_borrow === true
              )
            ) {
              const detail = reject(
                'FAST EQUITY SCALP: stock is not easy-to-borrow shortable',
                {
                  spreadPct: Number(spread.toFixed(4)),
                  minuteMomentumPct: Number(momentum.toFixed(4)),
                }
              );

              return {
                signal: null,
                diagnostics: {
                  long: reject(
                    'FAST EQUITY SCALP: current impulse is SHORT'
                  ),
                  short: detail,
                  threshold,
                },
              };
            }

            const estimatedCost = Math.max(
              0,
              Number(
                config.fastEquityScalpEstimatedRoundTripCostPct ??
                0.05
              )
            );

            const profitBuffer = Math.max(
              0,
              Number(config.fastEquityScalpProfitBufferPct ?? 0.10)
            );

            const entryFloor = Math.max(
              0.01,
              Number(config.fastEquityScalpEntryMomentumPct ?? 0.18)
            );

            const requiredImpulse = Math.max(
              entryFloor,
              estimatedCost + spread + profitBuffer
            );

            const absMomentum = Math.abs(momentum);

            if (absMomentum < requiredImpulse) {
              const detail = reject(
                `FAST EQUITY SCALP: impulse ${absMomentum.toFixed(3)}% below cost-aware ${requiredImpulse.toFixed(3)}%`,
                {
                  spreadPct: Number(spread.toFixed(4)),
                  minuteMomentumPct: Number(momentum.toFixed(4)),
                }
              );

              return {
                signal: null,
                diagnostics: {
                  long:
                    direction === 'LONG'
                      ? detail
                      : reject(
                          'FAST EQUITY SCALP: current impulse is SHORT'
                        ),
                  short:
                    direction === 'SHORT'
                      ? detail
                      : reject(
                          'FAST EQUITY SCALP: current impulse is LONG'
                        ),
                  threshold,
                },
              };
            }

            const trend3 = trendPct(signalBars, 3);
            const trend5 = trendPct(signalBars, 5);
            const trend15 = trendPct(signalBars, 15);

            const previousClose = c(signalBars.at(-2));
            const latestClose = c(signalBars.at(-1));

            const completedMove =
              Number.isFinite(previousClose) &&
              Number.isFinite(latestClose) &&
              previousClose > 0
                ? ((latestClose - previousClose) / previousClose) * 100
                : 0;

            const reversalAgainstLong =
              direction === 'LONG' &&
              completedMove < -0.35 &&
              absMomentum < requiredImpulse + 0.20;

            const reversalAgainstShort =
              direction === 'SHORT' &&
              completedMove > 0.35 &&
              absMomentum < requiredImpulse + 0.20;

            if (reversalAgainstLong || reversalAgainstShort) {
              const detail = reject(
                'FAST EQUITY SCALP: impulse not strong enough to reverse last completed move',
                {
                  spreadPct: Number(spread.toFixed(4)),
                  minuteMomentumPct: Number(momentum.toFixed(4)),
                  trend5Pct: Number(trend5.toFixed(4)),
                  trend15Pct: Number(trend15.toFixed(4)),
                }
              );

              return {
                signal: null,
                diagnostics: {
                  long:
                    direction === 'LONG'
                      ? detail
                      : reject(
                          'FAST EQUITY SCALP: current impulse is SHORT'
                        ),
                  short:
                    direction === 'SHORT'
                      ? detail
                      : reject(
                          'FAST EQUITY SCALP: current impulse is LONG'
                        ),
                  threshold,
                },
              };
            }

            const recentVolume = volumeRatio(signalBars, 6);

            const favorableTrend3 =
              direction === 'LONG'
                ? trend3 > 0
                : trend3 < 0;

            const favorableCompletedMove =
              direction === 'LONG'
                ? completedMove > 0
                : completedMove < 0;

            const alignedRegime =
              marketRegime?.direction === direction;

            const components = {
              costCoverage: 4,
              impulse: 2,
              tightSpread: spread <= maxSpread * 0.5 ? 1 : 0,
              localTurn:
                favorableTrend3 || favorableCompletedMove
                  ? 1
                  : 0,
              acceleration:
                absMomentum >= requiredImpulse + 0.12
                  ? 1
                  : 0,
              regime: alignedRegime ? 1 : 0,
              volume: recentVolume >= 1.05 ? 1 : 0,
            };

            const score = Math.min(
              10,
              8 +
                (components.acceleration ? 1 : 0) +
                (components.localTurn ? 1 : 0)
            );

            const detail = {
              eligible: true,
              score,
              reason: null,
              components,
              trigger: 'fast_equity_scalp',
              earlyEntry: true,
              earlyEntryConfirmed: true,
              trend5Pct: Number(trend5.toFixed(4)),
              trend15Pct: Number(trend15.toFixed(4)),
              minuteMomentumPct: Number(momentum.toFixed(4)),
              recentVolumeRatio: Number(recentVolume.toFixed(3)),
              spreadPct: Number(spread.toFixed(4)),
              vwap: null,
              vwapDistanceAtr: null,
              breakoutDistanceAtr: null,
              breakoutType: 'FAST_EQUITY_SCALP_1M',
              breakoutLevel: null,
              openingRange: null,
              rollingBreakout: null,
              regime: marketRegime,
              requiredImpulsePct: Number(
                requiredImpulse.toFixed(4)
              ),
              completedBarMovePct: Number(
                completedMove.toFixed(4)
              ),
              exitPlan: {
                atrPct: null,
                stopLossPct: Number(
                  config.fastEquityScalpStopLossPct ?? 0.28
                ),
                takeProfitPct: Number(
                  config.fastEquityScalpTakeProfitPct ?? 0.60
                ),
                estimatedRoundTripCostPct: estimatedCost,
                netRewardRiskRatio: null,
                trailTriggerPct: Number(
                  config.fastEquityScalpTrailTriggerPct ?? 0.36
                ),
                trailDistancePct: Number(
                  config.fastEquityScalpTrailDistancePct ?? 0.12
                ),
                trailFloorPct: Number(
                  config.fastEquityScalpTrailFloorPct ?? 0.22
                ),
                breakoutFailureWindowMinutes: 0,
                breakoutFailureAtr: 0,
                maxHoldMinutes: Number(
                  config.fastEquityScalpMaxHoldMinutes ?? 5
                ),
              },
            };

            if (score < threshold) {
              return {
                signal: null,
                diagnostics: {
                  long:
                    direction === 'LONG'
                      ? detail
                      : reject(
                          'FAST EQUITY SCALP: current impulse is SHORT'
                        ),
                  short:
                    direction === 'SHORT'
                      ? detail
                      : reject(
                          'FAST EQUITY SCALP: current impulse is LONG'
                        ),
                  threshold,
                },
              };
            }

            return {
              signal: {
                symbol: asset.symbol,
                name: asset.name || asset.symbol,
                assetClass: 'us_equity',
                fractionable: asset.fractionable === true,
                direction,
                score,
                price,
                strategy: 'EQUITY_FAST_SCALP',
                signal: detail,
              },
              diagnostics: {
                long:
                  direction === 'LONG'
                    ? detail
                    : reject(
                        'FAST EQUITY SCALP: current impulse is SHORT'
                      ),
                short:
                  direction === 'SHORT'
                    ? detail
                    : reject(
                        'FAST EQUITY SCALP: current impulse is LONG'
                      ),
                threshold,
              },
            };
          }

          """

          if "function evaluateEquityFastScalpCandidate" not in s:
              marker = "export function evaluateEquityCandidate({\n"
              if marker not in s:
                  raise SystemExit(
                      "Could not find evaluateEquityCandidate insertion point"
                  )
              s = s.replace(
                  marker,
                  textwrap.dedent(evaluator).lstrip() + marker,
                  1,
              )

          branch_anchor = """export function evaluateEquityCandidate({
            asset,
            snapshot,
            bars,
            marketRegime,
            config = STRATEGY_DEFAULTS,
            now = new Date(),
          }) {
          """

          if "return evaluateEquityFastScalpCandidate({" not in s:
              branch = branch_anchor + """  if (config.fastEquityScalpEnabled === true) {
            return evaluateEquityFastScalpCandidate({
              asset,
              snapshot,
              bars,
              marketRegime,
              config,
              now,
            });
          }

          """
              s = replace_once(
                  s,
                  branch_anchor,
                  branch,
                  "equity scalp evaluator branch",
              )

          p.write_text(s, encoding="utf-8")

          monitor = r"""import { store } from './store.js';
          import {
            getCryptoSnapshots,
            getStockSnapshots,
          } from './alpacaClient.js';
          import { minuteMomentumPct } from './strategyEngine.js';

          const DEFAULTS = {
            fastScalpReversalMomentumPct: -0.08,
            fastScalpFadeMomentumPct: 0.02,
            fastScalpCostLockPct: 0.60,
            fastEquityScalpReversalMomentumPct: 0.05,
            fastEquityScalpFadeMomentumPct: 0.01,
            fastEquityScalpCostLockPct: 0.25,
          };

          let timer = null;
          let busy = false;

          function snapshotFor(snapshots, symbol) {
            const compact = String(symbol || '').replace('/', '');
            return snapshots?.[symbol] || snapshots?.[compact] || null;
          }

          function currentPrice(snapshot) {
            return Number(
              snapshot?.latestTrade?.p ??
              snapshot?.minuteBar?.c ??
              snapshot?.dailyBar?.c
            );
          }

          function markPendingExit(trade, reason) {
            const latest = store.getOne('trades', trade.id);

            if (
              !latest ||
              latest.result !== null ||
              latest.pending_exit_reason
            ) {
              return;
            }

            store.update('trades', trade.id, {
              pending_exit_reason: reason,
              pending_exit_started_at: new Date().toISOString(),
              fast_scalp_exit_signal_at: new Date().toISOString(),
            });

            console.log(`[fast-scalp] ${trade.market}: ${reason}`);
          }

          async function checkCryptoScalps(open, config) {
            if (!open.length) return;

            const symbols = [
              ...new Set(open.map((trade) => trade.market)),
            ];

            const snapshots = await getCryptoSnapshots(
              'paper',
              symbols
            );

            for (const trade of open) {
              const snapshot = snapshotFor(
                snapshots,
                trade.market
              );

              if (!snapshot) continue;

              const momentum = minuteMomentumPct(snapshot);
              const price = currentPrice(snapshot);
              const entry = Number(trade.entry_price);

              if (
                momentum != null &&
                momentum <=
                  Number(config.fastScalpReversalMomentumPct)
              ) {
                markPendingExit(
                  trade,
                  `FAST SCALP 1m reversal ${momentum.toFixed(3)}%`
                );
                continue;
              }

              if (
                Number.isFinite(price) &&
                Number.isFinite(entry) &&
                entry > 0 &&
                momentum != null
              ) {
                const grossMove =
                  ((price - entry) / entry) * 100;

                if (
                  grossMove >=
                    Number(config.fastScalpCostLockPct) &&
                  momentum <=
                    Number(config.fastScalpFadeMomentumPct)
                ) {
                  markPendingExit(
                    trade,
                    `FAST SCALP momentum fade after +${grossMove.toFixed(3)}%; 1m ${momentum.toFixed(3)}%`
                  );
                }
              }
            }
          }

          async function checkEquityScalps(open, config) {
            if (!open.length) return;

            const symbols = [
              ...new Set(open.map((trade) => trade.market)),
            ];

            const liveBotConfig = store.getConfig(
              'liveBotConfig',
              {}
            );

            const snapshots = await getStockSnapshots(
              'paper',
              symbols,
              {
                feed: liveBotConfig.stockFeed || 'iex',
              }
            );

            for (const trade of open) {
              const snapshot = snapshotFor(
                snapshots,
                trade.market
              );

              if (!snapshot) continue;

              const momentum = minuteMomentumPct(snapshot);
              const price = currentPrice(snapshot);
              const entry = Number(trade.entry_price);

              if (
                momentum == null ||
                !Number.isFinite(price) ||
                !Number.isFinite(entry) ||
                entry <= 0
              ) {
                continue;
              }

              const direction =
                trade.direction === 'SHORT'
                  ? 'SHORT'
                  : 'LONG';

              const favorableMomentum =
                direction === 'SHORT'
                  ? -momentum
                  : momentum;

              const grossMove =
                direction === 'SHORT'
                  ? ((entry - price) / entry) * 100
                  : ((price - entry) / entry) * 100;

              const reversalMagnitude = Math.max(
                0,
                Number(
                  config.fastEquityScalpReversalMomentumPct ??
                  0.05
                )
              );

              if (
                favorableMomentum <= -reversalMagnitude
              ) {
                markPendingExit(
                  trade,
                  `FAST EQUITY SCALP ${direction} 1m reversal; favorable momentum ${favorableMomentum.toFixed(3)}%`
                );
                continue;
              }

              if (
                grossMove >=
                  Number(
                    config.fastEquityScalpCostLockPct ??
                    0.25
                  ) &&
                favorableMomentum <=
                  Number(
                    config.fastEquityScalpFadeMomentumPct ??
                    0.01
                  )
              ) {
                markPendingExit(
                  trade,
                  `FAST EQUITY SCALP ${direction} fade after +${grossMove.toFixed(3)}%; favorable 1m ${favorableMomentum.toFixed(3)}%`
                );
              }
            }
          }

          async function checkFastScalps() {
            if (busy) return;
            busy = true;

            try {
              const mode = store.getConfig(
                'tradingMode',
                { mode: 'paper' }
              ).mode;

              const tradingConfig = store.getConfig(
                'tradingConfig',
                {}
              );

              if (
                mode !== 'paper' ||
                !(
                  tradingConfig.fastScalpEnabled === true ||
                  tradingConfig.fastEquityScalpEnabled === true
                )
              ) {
                return;
              }

              const allOpen = store
                .getAll('trades')
                .filter(
                  (trade) =>
                    trade.result === null &&
                    !trade.pending_exit_reason
                );

              const cryptoOpen =
                tradingConfig.fastScalpEnabled === true
                  ? allOpen.filter(
                      (trade) =>
                        trade.asset_class === 'crypto' &&
                        trade.strategy_name === 'CRYPTO_FAST_SCALP'
                    )
                  : [];

              const equityOpen =
                tradingConfig.fastEquityScalpEnabled === true
                  ? allOpen.filter(
                      (trade) =>
                        trade.asset_class === 'us_equity' &&
                        trade.strategy_name === 'EQUITY_FAST_SCALP'
                    )
                  : [];

              if (!cryptoOpen.length && !equityOpen.length) {
                return;
              }

              const config = {
                ...DEFAULTS,
                ...store.getConfig('strategyConfig', {}),
              };

              await checkCryptoScalps(
                cryptoOpen,
                config
              );

              await checkEquityScalps(
                equityOpen,
                config
              );
            } catch (error) {
              console.warn(
                `[fast-scalp-monitor] ${error.message}`
              );
            } finally {
              busy = false;
            }
          }

          export function startFastScalpMonitor() {
            if (timer) return;

            timer = setInterval(
              checkFastScalps,
              5000
            );

            timer.unref?.();

            setTimeout(
              checkFastScalps,
              1500
            ).unref?.();

            console.log(
              '[fast-scalp] PAPER-only crypto + equity reversal monitor active.'
            );
          }
          """
          Path("momentumflow/fastScalpMonitor.js").write_text(
              textwrap.dedent(monitor).lstrip(),
              encoding="utf-8",
          )

          toggle = r"""import React, { useEffect, useState } from 'react';
          import { api } from '../lib/api.js';

          export default function FastScalpToggle() {
            const [cryptoEnabled, setCryptoEnabled] = useState(false);
            const [equityEnabled, setEquityEnabled] = useState(false);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState('');
            const [error, setError] = useState('');

            async function refresh() {
              try {
                setLoading(true);
                setError('');

                const cfg = await api.getTradingConfig();

                setCryptoEnabled(
                  cfg?.fastScalpEnabled === true
                );

                setEquityEnabled(
                  cfg?.fastEquityScalpEnabled === true
                );
              } catch (err) {
                setError(
                  err?.message ||
                  'Failed to load Fast Scalp settings.'
                );
              } finally {
                setLoading(false);
              }
            }

            useEffect(() => {
              refresh();
            }, []);

            async function saveSetting(key, value) {
              try {
                setSaving(key);
                setError('');

                const saved = await api.setTradingConfig({
                  [key]: value,
                });

                setCryptoEnabled(
                  saved?.fastScalpEnabled === true
                );

                setEquityEnabled(
                  saved?.fastEquityScalpEnabled === true
                );
              } catch (err) {
                setError(
                  err?.message ||
                  'Failed to save Fast Scalp setting.'
                );
              } finally {
                setSaving('');
              }
            }

            return (
              <div style={stack}>
                <ScalpCard
                  title="FAST SCALP — 1 MIN CRYPTO"
                  note="PAPER only. Buys strong upward 1-minute crypto impulses and exits back to cash on reversal/fade. Crypto shorts remain disabled."
                  enabled={cryptoEnabled}
                  loading={loading}
                  saving={saving === 'fastScalpEnabled'}
                  onToggle={() =>
                    saveSetting(
                      'fastScalpEnabled',
                      !cryptoEnabled
                    )
                  }
                  onText="CRYPTO FAST SCALP ON"
                  offText="CRYPTO FAST SCALP OFF — v19 crypto remains active"
                />

                <ScalpCard
                  title="FAST SCALP — 1 MIN EQUITIES"
                  note="PAPER only. Runs during the regular equity session and trades strong 1-minute moves LONG or SHORT. SHORT requires Alpaca shortable + easy-to-borrow status."
                  enabled={equityEnabled}
                  loading={loading}
                  saving={saving === 'fastEquityScalpEnabled'}
                  onToggle={() =>
                    saveSetting(
                      'fastEquityScalpEnabled',
                      !equityEnabled
                    )
                  }
                  onText="EQUITY FAST SCALP ON — LONG + SHORT"
                  offText="EQUITY FAST SCALP OFF — v19 equities remain active"
                />

                {error && (
                  <div style={errorStyle}>
                    {error}
                  </div>
                )}
              </div>
            );
          }

          function ScalpCard({
            title,
            note,
            enabled,
            loading,
            saving,
            onToggle,
            onText,
