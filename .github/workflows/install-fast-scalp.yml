        working-directory: momentumflow/frontend
        run: |
          npm install
          npm run build

      - name: Commit Fast Scalp
        shell: bash
        run: |
          git config user.name "MomentumFlow Installer"
          git config user.email "actions@users.noreply.github.com"
          git add momentumflow
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add PAPER-only 1-minute crypto Fast Scalp"
          git push origin HEAD:main
