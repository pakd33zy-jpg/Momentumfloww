          print("Equity Fast Scalp patch applied.")
          PY

      - name: Validate backend JavaScript
        run: |
          node --check momentumflow/tradingConfig.js
          node --check momentumflow/tradingMode.js
          node --check momentumflow/strategyEngine.js
          node --check momentumflow/fastScalpMonitor.js
          node --check momentumflow/server.js

      - name: Validate frontend build
        working-directory: momentumflow/frontend
        run: |
          npm install
          npm run build

      - name: Remove generated build output from commit
        shell: bash
        run: |
          git restore momentumflow/frontend/dist 2>/dev/null || true
          git restore momentumflow/frontend/package-lock.json 2>/dev/null || true
          git clean -fd momentumflow/frontend/dist 2>/dev/null || true

      - name: Commit Equity Fast Scalp
        shell: bash
        run: |
          git config user.name "MomentumFlow Installer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            momentumflow/tradingConfig.js \
            momentumflow/tradingMode.js \
            momentumflow/strategyEngine.js \
            momentumflow/fastScalpMonitor.js \
            momentumflow/frontend/src/components/FastScalpToggle.jsx

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add PAPER-only 1-minute equity Fast Scalp"
          git push origin HEAD:main
