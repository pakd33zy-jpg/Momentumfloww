name: MomentumFlow Status Snapshot

on:
  push:
    paths:
      - '.github/workflows/liquid55_20_robustness.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query deployed status
        shell: bash
        run: |
          set -euo pipefail

          echo "=== live-bot ==="
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/live-bot/status"             | jq -c '{running,mode,lastTickAt,lastError,lastDecision,openPositionCount,maxOpenPositions,cryptoEngine:.engines.crypto,strategyPerformance}'

          echo "=== broker ==="
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/live-bot/broker-diagnostics"             | jq -c '{
                mode,
                account,
                cryptoPositions:[
                  .positions[]?
                  | select(.asset_class=="crypto")
                  | {
                      symbol,
                      qty:(.qty|tonumber),
                      avgEntry:(.avg_entry_price|tonumber),
                      current:(.current_price|tonumber),
                      marketValue:(.market_value|tonumber),
                      unrealizedDollar:(((.current_price|tonumber)-(.avg_entry_price|tonumber))*(.qty|tonumber)),
                      unrealizedPct:((((.current_price|tonumber)/(.avg_entry_price|tonumber))-1)*100)
                    }
                ],
                cryptoOpenPnlDollar:([
                  .positions[]?
                  | select(.asset_class=="crypto")
                  | (((.current_price|tonumber)-(.avg_entry_price|tonumber))*(.qty|tonumber))
                ] | add // 0)
              }'

          echo "=== liquid100 shadow ==="
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/breakout-55-20-shadow/status"             | jq -c '{running,mode,placesOrders,lastTickAt,lastDecision,lastError,lastProcessedBar,openPositionCount,pendingEntryCount,pendingExitCount,closedTradeCount:(.closedTrades|length),performance}'

          echo "=== validation50 shadow ==="
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/breakout-55-20-validation50-shadow/status"             | jq -c '{running,mode,placesOrders,lastTickAt,lastDecision,lastError,lastProcessedBar,openPositionCount,pendingEntryCount,pendingExitCount,closedTradeCount:(.closedTrades|length),performance}'
