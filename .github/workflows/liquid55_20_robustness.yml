name: Crypto PnL Snapshot

on:
  push:
    paths:
      - '.github/workflows/liquid55_20_robustness.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query deployed crypto paper performance
        shell: bash
        run: |
          set -euo pipefail
          echo "=== crypto runtime + realized ==="
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/live-bot/status"             | jq -c '{
                running,
                mode,
                lastTickAt,
                lastError,
                lastDecision,
                cryptoEngine:.engines.crypto,
                cryptoPerformance:(.strategyPerformance[]? | select(.strategy=="CRYPTO_MACD_VALLEY_CROSS_PAPER"))
              }'

          echo "=== crypto open positions ==="
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/live-bot/broker-diagnostics"             | jq -c '{
                mode,
                cryptoPositions:[
                  .positions[]?
                  | select(.asset_class=="crypto")
                  | {
                      symbol,
                      qty:(.qty|tonumber),
                      avgEntry:(.avg_entry_price|tonumber),
                      current:(.current_price|tonumber),
                      marketValue:(.market_value|tonumber),
                      unrealizedDollar:(((.current_price|tonumber)-(.avg_entry_price|tonumber))*(.qty|tonumber)),
                      unrealizedPct:((((.current_price|tonumber)/(.avg_entry_price|tonumber))-1)*100)
                    }
                ],
                cryptoOpenPnlDollar:([
                  .positions[]?
                  | select(.asset_class=="crypto")
                  | (((.current_price|tonumber)-(.avg_entry_price|tonumber))*(.qty|tonumber))
                ] | add // 0)
              }'
