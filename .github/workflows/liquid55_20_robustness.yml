name: C62 Regime Snapshot

on:
  push:
    paths:
      - '.github/workflows/liquid55_20_robustness.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Query older regime window
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 1500             "https://momentumfloww.onrender.com/api/research/c62-regime/backtest?window=older"             | jq -c '{window,variants}'
      - name: Query recent regime window
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 1500             "https://momentumfloww.onrender.com/api/research/c62-regime/backtest?window=recent"             | jq -c '{window,variants}'
