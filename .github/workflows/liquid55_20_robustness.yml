name: C62 Shadow Status

on:
  push:
    paths:
      - '.github/workflows/liquid55_20_robustness.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query C62 shadow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120             "https://momentumfloww.onrender.com/api/c62-shadow/status"             | jq -c '{running,mode,placesOrders,strategy,lastTickAt,lastDecision,lastError,rules,performance,openPositions:(.positions|keys),closedTrades:(.closedTrades|length)}'
