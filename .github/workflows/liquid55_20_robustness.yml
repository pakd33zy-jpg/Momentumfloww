name: 55/20 Recombination Snapshot

on:
  push:
    paths:
      - '.github/workflows/liquid55_20_robustness.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare frozen allocation rules
        shell: bash
        run: |
          set -euo pipefail
          for universe in liquid100 validation50; do
            echo "=== $universe ==="
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 300               "https://momentumfloww.onrender.com/api/research/breakout-liquid/daily?days=1825&universe=$universe"               | jq -c '{
                  universe,
                  baseline:.capitalAllocationStudy.selectionStudyAt2_5Pct.variants[0],
                  momentum63:.capitalAllocationStudy.selectionStudyAt2_5Pct.variants[1]
                }'
          done
