name: Crypto V51 Shadow Validation

on:
  push:
    branches: [main]
    paths:
      - 'momentumflow/cryptoForwardLearningV51.js'
      - 'momentumflow/cryptoForwardLearningV51.test.js'
      - 'momentumflow/cryptoV51ShadowMonitor.js'
      - 'momentumflow/cryptoV51ShadowRouter.js'
      - 'momentumflow/server.js'
      - '.github/workflows/crypto-v51-shadow-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momentumflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: momentumflow/package-lock.json
      - run: npm ci
      - run: node --test cryptoForwardLearningV51.test.js
      - name: Import smoke test
        run: node -e "Promise.all([import('./cryptoV51ShadowMonitor.js'),import('./cryptoV51ShadowRouter.js')]).then(()=>console.log('V51 imports OK'))"
