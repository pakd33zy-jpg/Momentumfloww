name: Validate MACD Peak Crypto Paper Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'momentumflow/cryptoMacdPeakStrategy.js'
      - 'momentumflow/cryptoMacdPeakStrategy.test.js'
      - 'momentumflow/cryptoStrategyV35.js'
      - 'momentumflow/liveBotV35.js'
      - 'momentumflow/server.js'
      - '.github/workflows/activate-v51-crypto-paper.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check momentumflow/cryptoMacdPeakStrategy.js
          node --check momentumflow/cryptoStrategyV35.js
          node --check momentumflow/liveBotV35.js
          node --check momentumflow/server.js
      - name: MACD strategy tests
        working-directory: momentumflow
        run: node --test cryptoMacdPeakStrategy.test.js
