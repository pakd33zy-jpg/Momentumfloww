name: Kalshi REAL history BTC15m snapshot
on:
  push:
    branches:
      - research/kalshi-15m-paper-20261014
    paths:
      - 'research/kalshiHistoric15m.mjs'
      - 'research/kalshiHistoric15m.test.mjs'
      - '.github/workflows/kalshi-real-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test research/kalshiHistoric15m.test.mjs
      - name: Fetch public Kalshi history and calculate quote-based results
        run: node research/kalshiHistoric15m.mjs
      - name: Summarize real historical results without trading
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("research/results/KALSHI_BTC15M_REAL_HISTORY.json","utf8"));
            for (const [name,folds] of Object.entries(r.results || {})) {
              for (const [fold,s] of Object.entries(folds)) {
                const {tradeLog,...summary}=s;
                console.log("REAL_HISTORY_METRICS",JSON.stringify({name,fold,...summary}));
              }
            }
            console.log("REAL_HISTORY_DATA", JSON.stringify({status:r.status,marketsListed:r.marketsListed,marketsSampled:r.marketsSampled,eligibleSignals:r.eligibleSignals,firstMarket:r.firstMarket,lastMarket:r.lastMarket,skipped:r.skippedReasons,errors:r.apiErrors}));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-btc15m-real-history
          path: research/results/KALSHI_BTC15M_REAL_HISTORY.json
          retention-days: 14
