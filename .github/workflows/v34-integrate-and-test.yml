name: Integrate and validate V34

on:
  push:
    branches:
      - v34-risk-model
    paths:
      - ".github/workflows/v34-integrate-and-test.yml"
      - "momentumflow/integrate_v34.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V34 branch
        uses: actions/checkout@v4
        with:
          ref: v34-risk-model
          fetch-depth: 0

      - name: Apply V34 integration patch
        run: python momentumflow/integrate_v34.py

      - name: Install backend dependencies
        working-directory: momentumflow
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check live bot
        working-directory: momentumflow
        run: node --check liveBot.js

      - name: Run V34 tests
        working-directory: momentumflow
        run: node --test cryptoStrategyV34.test.js

      - name: Run full backend test suite
        working-directory: momentumflow
        run: npm test

      - name: Commit integrated V34 only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add momentumflow/liveBot.js momentumflow/cryptoStrategyV34.js momentumflow/frontend/src/components/RejectionLogPanel.jsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Wire V34 evidence strategy into live bot"
            git push origin HEAD:v34-risk-model
          fi
