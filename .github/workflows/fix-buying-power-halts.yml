name: Fix Buying Power Halts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-buying-power-halts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch entry sizing and rejection handling
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_buying_power.py
          python3 /tmp/patch_buying_power.py

      - name: Validate backend syntax
        run: |
          node --check momentumflow/liveBot.js
          node --check momentumflow/server.js

      - name: Verify patch markers
        shell: bash
        run: |
          grep -q "entryBuyingPowerFraction: 0.90" momentumflow/liveBot.js
          grep -q "buying-power rejection; bot keeps running" momentumflow/liveBot.js
          grep -q "new entries cooling down" momentumflow/liveBot.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "MomentumFlow Installer"
          git config user.email "actions@users.noreply.github.com"
          git add momentumflow/liveBot.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Keep bot running after buying power entry rejects"
          git push origin HEAD:main
