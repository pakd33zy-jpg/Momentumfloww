name: Recombination
on: [push]
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 "https://momentumfloww.onrender.com/api/research/breakout-liquid/daily?days=1825&universe=liquid100" > liquid.json
          jq -c '.capitalAllocationStudy.selectionStudyAt2_5Pct' liquid.json
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 "https://momentumfloww.onrender.com/api/research/breakout-liquid/daily?days=1825&universe=validation50" > validation.json
          jq -c '.capitalAllocationStudy.selectionStudyAt2_5Pct' validation.json
